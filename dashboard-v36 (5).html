<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>eAuction — Widget Workspace v34</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Inter:wght@300;400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  /* Primary / Brand Blue — Color Spec */
  --primary:#0C56C9;--primary-deep:#0E49B5;--secondary:#2F80ED;--accent:#06B6D4;--highlight:#A3E4D7;
  --bg:#F7FBFD;--surface:#FFFFFF;--line:#E6E8EB;--line-2:#d3d7db;--text:#383838;--muted:#7C7C7C;
  --hero-grad:linear-gradient(to right,#116FB3 0%,#0E50BD 51%,#49D4FF 100%);
  --brand:#0C56C9;--brand-lt:#DAF0FF;--brand-mid:#2F80ED;
  --ok:#17794C;--ok-bg:#DAEFE1;--ok-bd:#A3E4D7;
  --warn:#a5702a;--warn-bg:#fdf3ea;--warn-bd:#E5C185;
  --danger:#E03737;--danger-bg:#FEF1EF;--danger-bd:#D99B9B;
  --blue:#2F80ED;--blue-bg:#DAF0FF;--blue-bd:#0C56C9;
  --teal:#019E82;--teal-bg:#E6F7F0;--teal-bd:#A3E4D7;
  --orange:#F27326;--orange-bg:#fdf3ea;--orange-bd:#E5C185;
  --purple:#8B5CF6;--purple-bg:#EDE9FE;--purple-bd:#d8c9ee;--purple-deep:#7C3AED;
  --shadow-xs:0 1px 3px rgba(0,0,0,.03);
  --shadow-sm:0 2px 8px rgba(0,0,0,.03),0 1px 3px rgba(0,0,0,.03);
  --shadow-md:0 8px 24px rgba(0,0,0,.06);
  --shadow-lg:0 20px 48px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Sarabun','Inter',Arial,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;min-height:100vh}
.container{max-width:1280px;margin:0 auto;padding:0 20px 32px}

.topbar-wrap{position:sticky;top:0;z-index:120;background:var(--hero-grad);box-shadow:0 4px 18px rgba(0,93,196,.2)}
.topbar-wrap::after{content:'';position:absolute;inset:0;background:radial-gradient(120% 180% at 88% -40%,rgba(255,255,255,.28),transparent 55%);pointer-events:none}
.topbar{height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.topbar-left{display:flex;align-items:center;gap:16px;height:100%}
.brand-mark{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.01em;white-space:nowrap}
.brand-mark .brand-one{font-style:italic}
.app-name{font-size:14px;font-weight:600;color:#fff}
.tb-nav{display:flex;align-items:center;gap:20px;height:100%;margin-left:4px}
.tb-nav-tab{background:none;border:none;color:rgba(255,255,255,.72);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;height:100%;padding:0;position:relative}
.tb-nav-tab.active{color:#fff}
.tb-nav-tab.active::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:#fff;border-radius:2px}
.topbar-right{display:flex;align-items:center;gap:9px}
.tb-icon-btn{width:32px;height:32px;border-radius:9px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:.15s;position:relative;font-family:inherit;font-size:16px}
.tb-icon-btn:hover{background:rgba(255,255,255,.16)}
.tb-badge{position:absolute;top:-2px;right:-2px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:#E03737;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.5px solid #1a7fc9}
.tb-vdiv{width:1px;height:20px;background:rgba(255,255,255,.35);margin:0 4px}
.tb-help-btn{display:flex;align-items:center;gap:4px;background:none;border:none;color:#fff;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;padding:6px 4px}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ok-bg);border:none;font-size:11px;font-weight:700;color:var(--teal)}
.notif-dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#E03737;border:1.5px solid #1a7fc9}

.user-switch{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:3px 4px 3px 9px;backdrop-filter:blur(6px)}
.user-switch .lbl{font-size:8.5px;color:rgba(255,255,255,.8);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.user-switch select{background:rgba(255,255,255,.92);border:none;border-radius:6px;padding:4px 7px;font-size:10.5px;font-weight:600;color:var(--text);font-family:inherit;cursor:pointer;outline:none}

.action-bar{background:var(--surface);border-bottom:1px solid var(--line);padding:0 24px}
.action-bar-inner{max-width:1600px;margin:0 auto;min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0}
.role-badges{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted)}
.action-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.tb-divider{width:1px;height:20px;background:var(--line);margin:0 2px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12px;cursor:pointer;transition:.15s;font-family:inherit;border-radius:9px;height:36px;padding:0 14px;border:1px solid transparent}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--muted)}
.btn-ghost:hover{background:#f2f7fd;border-color:var(--line-2);color:var(--text)}
.btn-create{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 4px 13px rgba(91,135,232,.28)}
.btn-create:hover{background:var(--primary-deep)}
.btn-qa{background:#FEF1EF;border-color:#D99B9B;color:#B52A2A}
.btn-qa:hover{background:#FEF1EF}
.btn-qa i{color:#E03737}
.cnt{font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.cnt-red{background:#E03737;color:#fff}
.cnt-blue{background:var(--primary);color:#fff}
.cnt-green{background:var(--ok);color:#fff}
.dd-wrap{position:relative}
.tb-dropdown{position:absolute;top:calc(100% + 8px);right:0;width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);z-index:500;overflow:hidden;display:none}
.tb-dropdown.open{display:block}
.tb-dd-header{padding:12px 15px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--text);background:var(--bg);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.04em}
.tb-dd-item{padding:11px 15px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;cursor:pointer;transition:.12s}
.tb-dd-item:last-child{border-bottom:none}
.tb-dd-item:hover{background:#f2f7fd}
.tb-dd-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px}
.tb-dd-name{font-size:13px;font-weight:700;color:var(--text)}
.tb-dd-id{font-size:12px;color:var(--primary);font-weight:700;margin-top:2px}
.tb-dd-sub{font-size:10px;color:var(--muted);margin-top:2px}
.badge-small{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid transparent;white-space:nowrap;flex-shrink:0}
.b-new{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bd)}
.notif-tabs{display:flex;align-items:center;gap:8px;padding:10px 15px;border-bottom:1px solid var(--line)}
.notif-tab{height:26px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.notif-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.notif-item{display:flex;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);cursor:pointer;transition:.12s;align-items:flex-start}
.notif-item.unread{background:var(--bg)}
.notif-item:last-child{border-bottom:none}
.notif-item:hover{background:#f6f9fd}
.notif-ava{width:30px;height:30px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.notif-body{flex:1;min-width:0}
.notif-text{font-size:12px;line-height:1.5;color:var(--text);font-weight:500}
.notif-time{font-size:10px;color:var(--muted);margin-top:3px}
.notif-dot-ind{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:6px}
.tb-dd-header-flex{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--surface)}
.tb-dd-header-flex .t{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:6px}
.tb-dd-header-flex .t i{color:var(--primary)}
.tb-dd-mark{font-size:11px;font-weight:600;color:var(--brand-mid);cursor:pointer}

.date-dd-wrap{position:relative;display:inline-block}
.date-dd{position:fixed;top:0;left:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);z-index:400;display:none;padding:16px;width:600px}
.date-dd.open{display:block}
.date-dd-cols{display:flex;gap:22px}
.date-dd-col{flex:1;min-width:0}
.date-dd-label{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px}
.date-dd-input{height:32px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font-size:12px;width:100%;margin-bottom:10px;font-family:inherit;color:var(--text);background:#fbfcfe}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head button{width:24px;height:24px;border:none;background:transparent;cursor:pointer;color:var(--muted);font-size:13px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center}
.cal-head button:hover{background:#f2f7fd}
.cal-title{font-size:12px;font-weight:700;color:var(--text)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-dow{font-size:9.5px;font-weight:700;color:var(--muted);padding:4px 0}
.cal-day{font-size:11.5px;padding:6px 0;border-radius:7px;cursor:pointer;color:var(--text)}
.cal-day:hover{background:#f2f7fd}
.cal-day.muted{color:var(--line-2);cursor:default}
.cal-day.today{background:var(--primary);color:#fff;font-weight:700}
.cal-day.selected{background:var(--primary);color:#fff;font-weight:700}
.date-dd-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.date-dd-today{font-size:11px;color:var(--brand-mid);cursor:pointer;font-weight:600;text-align:center;margin-top:4px}
.btn-datepick{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn-datepick:hover{border-color:var(--line-2);background:#f2f7fd}
.btn-datepick.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
.b-done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}

.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:6px;font-size:11px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.st-draft{background:#F3F3F3;color:#7C7C7C;border-color:#E6E8EB}
.st-awaiting{background:var(--blue-bg);color:var(--secondary);border-color:#c6d8f2}
.st-rejected{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bd)}
.st-ptvn{background:var(--blue-bg);color:var(--secondary);border-color:#c6d8f2}
.st-active{background:var(--blue-bg);color:var(--secondary);border-color:#c6d8f2}
.st-closed{background:#F3F3F3;color:#7C7C7C;border-color:#E6E8EB}
.st-complete{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}
.st-canceled{background:#F3F3F3;color:#7C7C7C;border-color:#E6E8EB}
.st-live{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bd)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);position:relative;flex-shrink:0}
.live-dot::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--ok);animation:pulse 1.6s ease-out infinite}
.live-dot-sm{width:6px;height:6px;border-radius:50%;background:var(--danger);position:relative;flex-shrink:0;display:inline-block}
.live-dot-sm::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:1.5px solid var(--danger);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.7);opacity:0}}
/* [PATCH] Status per All_status spec: sub-alert แสดงเป็น (i) hover tooltip แทนข้อความ */
.info-tip{position:relative;display:inline-flex;align-items:center;margin-left:5px;color:var(--secondary);cursor:help;vertical-align:middle}
.info-tip i{font-size:14px}
.info-tip::after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 7px);transform:translateX(-50%);background:#22262f;color:#fff;font-size:10.5px;font-weight:600;padding:6px 10px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:var(--shadow-md);z-index:30}
.info-tip::before{content:'';position:absolute;left:50%;bottom:calc(100% + 2px);transform:translateX(-50%);border:5px solid transparent;border-top-color:#22262f;opacity:0;transition:opacity .15s;z-index:30}
.info-tip:hover::after,.info-tip:hover::before{opacity:1}

.aw{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 9px;border-radius:6px;font-size:11px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.aw-wait{background:var(--blue-bg);color:var(--secondary);border-color:#c6d8f2}
.aw-appr-wait{background:var(--blue-bg);color:var(--secondary);border-color:#c6d8f2}
.aw-rejected{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-bd)}
.aw-awarded{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-bd)}
.aw-noaward{background:#F3F3F3;color:#7C7C7C;border-color:#E6E8EB}
.aw-noresult{background:#F3F3F3;color:#7C7C7C;border-color:#E6E8EB}
.aw-insufficient{background:#F3F3F3;color:#7C7C7C;border-color:#E6E8EB}
.aw-none{background:#F3F3F3;color:#A0AAB2;border-color:#E6E8EB}

.dash-scope{margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scope-label{font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:5px}
.scope-label i{font-size:14px;color:var(--primary)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;box-shadow:var(--shadow-xs)}
.seg button{height:29px;padding:0 13px;border:none;background:transparent;font-size:11.5px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:7px;font-family:inherit;transition:.12s}
.seg button.active{background:var(--primary);color:#fff}
.seg button:hover:not(.active){background:#eef4ff;color:var(--text)}

.kpi-group{margin-top:10px;display:flex;flex-direction:column;gap:14px}
.kpi-block{flex:1;min-width:0}
.kpi-block-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;display:flex;align-items:center;gap:5px}
.kpi-block-label.l-purchaser{color:var(--brand-mid)}
.kpi-block-label.l-approver{color:var(--purple-deep)}
.kpi-cards{display:grid;gap:12px}
.kpi-cards.n6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi-cards.n2{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.kpi-cards.n1{grid-template-columns:1fr}
.kpi-divider-v{width:1px;background:var(--line-2);align-self:stretch;margin:18px 2px 0}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 12px 11px;box-shadow:var(--shadow-xs);position:relative;overflow:hidden;cursor:pointer;transition:.16s}
.gcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--line-2)}
.gcard.active-card{border-color:var(--primary);box-shadow:0 0 0 2px rgba(12,86,201,.16) inset}
.gcard.appr-card{border-color:var(--line)}
.gcard.appr-card.active-card{box-shadow:0 0 0 2px rgba(2,123,224,.18) inset}
.gcard .accent{position:absolute;inset:0 auto auto 0;height:3px;width:100%;background:#F27326}
.gcard.appr-card .accent{background:#027BE0}
.gc-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.gc-count{font-family:'Sarabun','Inter',sans-serif;font-size:26px;line-height:1;font-weight:700;color:var(--text)}
.gc-badge{width:16px;height:16px;border-radius:50%;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.gc-label{font-size:12px;color:var(--text);font-weight:700;line-height:1.3;white-space:nowrap}
.gc-label.gc-alert{color:var(--danger)}
.gc-sub{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.35}

/* approver-only quick action card in KPI row */
.qa-inline{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;box-shadow:var(--shadow-xs);display:flex;align-items:center;gap:11px;cursor:pointer;transition:.16s;height:100%}
.qa-inline:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--purple-bd)}
.qa-inline .qa-ic{width:36px;height:36px}

.layout{margin-top:12px;display:grid;grid-template-columns:1fr 300px;gap:12px;align-items:start}
.layout.no-side{grid-template-columns:1fr}
.main-col{display:flex;flex-direction:column;gap:12px;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);overflow:hidden}
.card.appr-accent{border-top:1px solid var(--line)}
.card-header{min-height:44px;padding:0 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fafcff}
.card-title{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px;color:var(--text)}
.card-title i{color:var(--primary)}
.card-title i.ap{color:var(--purple-deep)}
.hcount{font-size:11px;font-weight:600;color:var(--muted);background:#F4F5F8;border:1px solid var(--line);padding:1px 8px;border-radius:5px}
.af-bar{margin:12px 18px 0;display:none;align-items:center;justify-content:space-between;gap:8px;background:var(--brand-lt);border:1px solid #c6d8f2;border-radius:10px;padding:9px 13px;font-size:12px;color:var(--brand-mid);font-weight:600}
.af-bar.show{display:flex}
.af-bar .btn{height:26px;font-size:11px;background:var(--surface);border:1px solid #c6d8f2;color:var(--brand-mid);padding:0 10px}
.search-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 15px;border-bottom:1px solid var(--line);background:#fcfdff}
.in{height:34px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 11px;font-size:12px;color:var(--text);outline:none;font-family:inherit;transition:.15s}
.in:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(91,135,232,.13)}
.in-text{flex:1;min-width:140px}
.in-field{width:150px}
.in-date{width:135px}

.table-wrap{overflow-x:auto;position:relative}
table{width:100%;border-collapse:collapse;min-width:820px}
thead th{text-align:left;padding:8px 12px;font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;background:var(--bg);border-bottom:2px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer}
tbody td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:12px;color:var(--text)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#f6f9fd}
tbody tr.row-appr td:first-child{border-left:3px solid transparent}
.td-mono{font-family:inherit;font-size:12px;color:var(--text);font-weight:400}
.td-clamp{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.date-main{font-weight:600}

const PAGE_SIZE=5;
function dtShift(m){const d=new Date(Date.now()+m*60000);const p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
const formats=['English','English (Multi)','Sealed','Sealed (Multi)','MVB'];
const creators=['Somchai K.','Wipa R.','Nattapong T.','Suda C.','Anucha M.','Pranee S.','Krit W.'];
const nouns=['PPE Supply','Bearing Lot','Chemical Solvent','Boiler Tube','Packaging Film','IT Hardware','Forklift Maint.','Cooling Tower Chem','Scrap Metal','Lubricant Bulk','Safety Equipment','Pump Procurement','Network Infra','Conveyor Belt','Generator Fuel','Steam Turbine','Racking System','Office Furniture','Used Oil','Corn Byproduct'];

const USERS={
  somchai:{name:'Somchai K.',initials:'SK',roles:['purchaser','approver']},
  wipa:{name:'Wipa R.',initials:'WR',roles:['purchaser']},
  manee:{name:'Manee P.',initials:'MN',roles:['approver']}
};
let currentUserKey='somchai';
function CU(){return USERS[currentUserKey];}

      const p=x=>String(x).padStart(2,'0');const ds=`${y}-${p(d.getMonth()+1)}-${p(d.getDate())}`;

    if(f.result?.state==='pending'&&f.result.approver===me)tasks.push({auction:a,type:'result',label:'อนุมัติผลประมูล',requestedAt:f.result.requestedAt||''});
  });
  const order={setup:0,result:1};
  tasks.sort((x,y)=>order[x.type]-order[y.type]||auctionDateOnly(x.auction).localeCompare(auctionDateOnly(y.auction)));
  return tasks;
}
function approvalCounts(){const t=getApprovalTasks();return{setup:t.filter(x=>x.type==='setup').length,result:t.filter(x=>x.type==='result').length,total:t.length};}

function queryAuctions({listScope,groupFilter,q,field,from,to,page}){
  let rows=auctions.filter(scopeFilter);
  rows=rows.filter(a=>{if(listScope==='pipeline')return PIPELINE.includes(a.status);if(listScope==='complete')return a.status==='Complete';if(listScope==='canceled')return a.status==='Cancelled';return true;});
  if(listScope==='pipeline'&&groupFilter)rows=rows.filter(a=>groupFilter==='qaWaiting'?hasQaPending(a):groupOf(a)===groupFilter);
  rows=rows.filter(a=>matchField(a,q,field)&&matchDate(a,from,to));
  rows.sort((a,b)=>{const ar=isActionItem(a)?0:1,br=isActionItem(b)?0:1;if(listScope==='pipeline'){if(ar!==br)return ar-br;if(ar===0&&br===0){const pa=actionPriority(a),pb=actionPriority(b);if(pa!==pb)return pa-pb;return auctionDateOnly(a).localeCompare(auctionDateOnly(b));}}return auctionDateOnly(b).localeCompare(auctionDateOnly(a));});
  const total=rows.length,totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE)),p=Math.min(Math.max(1,page),totalPages);
  return{rows:rows.slice((p-1)*PAGE_SIZE,(p-1)*PAGE_SIZE+PAGE_SIZE),total,totalPages,page:p};
}
function matchField(a,q,field){if(!q)return true;const t=q.toLowerCase(),v=x=>(x||'').toLowerCase();const awardTxt=(a.status==='Cancelled'&&a.manualCancel)?'—':((awardMap[a.award]||{}).txt||'');switch(field){case 'auctionId':return v(a.auctionId).includes(t);case 'format':return v(a.format).includes(t);case 'type':return v(a.type).includes(t);case 'name':return v(a.name).includes(t);case 'award':return v(awardTxt).includes(t);case 'creator':return v(a.creator).includes(t);default:return[a.auctionId,a.format,a.type,a.name,awardTxt,a.creator].some(x=>v(x).includes(t));}}
function matchDate(a,from,to){const d=auctionDateOnly(a);if(!from&&!to)return true;if(from&&d<from)return false;if(to&&d>to)return false;return true;}

function rowTpl(a){const ph=auctionPhase(a);const rc=inAwardRejected(a)?'row-rej':(isActionItem(a)?'row-alert':(ph==='live'?'row-live':''));const showCreator=anScope==='team';return`<tr class="${rc}" onclick="openDetail('${a.auctionId}')"><td class="td-mono">${a.auctionId}</td><td>${a.format}</td><td>${a.type}</td><td class="td-clamp" title="${a.name}">${a.name}</td><td>${statusPill(a)}</td><td>${dateCell(a)}</td><td>${awardChip(a)}</td><td class="col-creator ${showCreator?'':'hide-col'}">${a.creator}</td></tr>`;}
function apprRowTpl(t){const a=t.auction;const tag=t.type==='setup'?`<span class="ap-type-txt">อนุมัติให้จัดงาน</span>`:`<span class="ap-type-txt">อนุมัติผลประมูล</span>`;return`<tr class="row-appr" onclick="openDetail('${a.auctionId}')"><td class="td-id">${a.auctionId}</td><td class="td-clamp" title="${a.name}">${a.name}</td><td>${tag}</td><td>${a.creator}</td><td style="color:var(--muted);font-size:12px">${fmtReqDate(t.requestedAt)}</td></tr>`;}

function renderPagination(btnsEl,infoEl,res,onGo){infoEl.innerHTML=`<strong>${res.total===0?0:(res.page-1)*PAGE_SIZE+1}–${Math.min(res.page*PAGE_SIZE,res.total)}</strong> จาก <strong>${res.total}</strong> รายการ`;btnsEl.innerHTML='';if(res.totalPages<=1)return;const add=(l,p,dis=false,act=false)=>{const b=document.createElement('button');b.className='pg-btn'+(act?' active':'');b.innerHTML=l;b.disabled=dis;if(!dis&&!act)b.onclick=()=>onGo(p);btnsEl.appendChild(b);};add('<i class="ti ti-chevron-left"></i>',res.page-1,res.page===1);const range=[];if(res.totalPages<=7){for(let i=1;i<=res.totalPages;i++)range.push(i);}else{range.push(1);if(res.page>3)range.push('…');for(let i=Math.max(2,res.page-1);i<=Math.min(res.totalPages-1,res.page+1);i++)range.push(i);if(res.page<res.totalPages-2)range.push('…');range.push(res.totalPages);}range.forEach(r=>{if(r==='…'){const s=document.createElement('span');s.className='pg-ellipsis';s.textContent='...';btnsEl.appendChild(s);}else add(r,r,false,r===res.page);});add('<i class="ti ti-chevron-right"></i>',res.page+1,res.page===res.totalPages);}

/* ===== SELECT DATE RANGE PICKER ===== */
const datePickers={};
function pad2(n){return String(n).padStart(2,'0');}
function fmtISO(y,m,d){return `${y}-${pad2(m+1)}-${pad2(d)}`;}
function fmtDMY(iso){if(!iso)return'';const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`;}
function dpState(prefix){if(!datePickers[prefix]){const now=new Date();const f=val(prefix+'From'),t=val(prefix+'To');datePickers[prefix]={fromY:now.getFullYear(),fromM:now.getMonth(),toY:now.getFullYear(),toM:now.getMonth(),draftFrom:f||'',draftTo:t||''};}return datePickers[prefix];}
function toggleDatePicker(prefix){document.querySelectorAll('.date-dd').forEach(d=>{if(d.id!==prefix+'DateDd')d.classList.remove('open');});const dd=document.getElementById(prefix+'DateDd');dd.classList.toggle('open');if(dd.classList.contains('open')){positionDateDd(prefix);renderDatePicker(prefix);}}
function positionDateDd(prefix){
  const dd=document.getElementById(prefix+'DateDd'),btn=document.getElementById(prefix+'DateBtn');
  if(!dd||!btn)return;
  const r=btn.getBoundingClientRect();
  const ddWidth=Math.min(600,window.innerWidth-24);
  dd.style.width=ddWidth+'px';
  let left=r.left;
  if(left+ddWidth>window.innerWidth-12)left=window.innerWidth-ddWidth-12;
  if(left<12)left=12;
  let top=r.bottom+8;
  dd.style.left=left+'px';
  dd.style.top=top+'px';
}
window.addEventListener('resize',()=>{document.querySelectorAll('.date-dd.open').forEach(d=>{const prefix=d.id.replace('DateDd','');positionDateDd(prefix);});});
window.addEventListener('scroll',()=>{document.querySelectorAll('.date-dd.open').forEach(d=>{const prefix=d.id.replace('DateDd','');positionDateDd(prefix);});},true);
function calGrid(y,m,selectedIso,prefix,which){const first=new Date(y,m,1),startDow=first.getDay(),daysInMonth=new Date(y,m+1,0).getDate(),prevDays=new Date(y,m,0).getDate();let cells='';for(let i=0;i<startDow;i++)cells+=`<div class="cal-day muted">${prevDays-startDow+1+i}</div>`;const now=new Date(),todayIso=fmtISO(now.getFullYear(),now.getMonth(),now.getDate());for(let d=1;d<=daysInMonth;d++){const iso=fmtISO(y,m,d);const cls=['cal-day'];if(iso===todayIso)cls.push('today');if(iso===selectedIso)cls.push('selected');cells+=`<div class="${cls.join(' ')}" onclick="dpPick('${prefix}','${which}','${iso}')">${d}</div>`;}return cells;}
function renderDatePicker(prefix){
  const st=dpState(prefix),monthName=(y,m)=>new Date(y,m,1).toLocaleDateString('en',{month:'long'}),dowHtml=['SU','MO','TU','WE','TH','FR','SA'].map(d=>`<div class="cal-dow">${d}</div>`).join('');
  document.getElementById(prefix+'DateDd').innerHTML=`<div class="date-dd-cols">`+
    `<div class="date-dd-col"><div class="date-dd-label">From:</div><input class="date-dd-input" value="${fmtDMY(st.draftFrom)}" placeholder="DD/MM/YYYY" readonly><div class="cal-head"><button onclick="dpNav('${prefix}','from',-1)"><i class="ti ti-chevron-left"></i></button><div class="cal-title">${monthName(st.fromY,st.fromM)}, ${st.fromY}</div><button onclick="dpNav('${prefix}','from',1)"><i class="ti ti-chevron-right"></i></button></div><div class="cal-grid">${dowHtml}${calGrid(st.fromY,st.fromM,st.draftFrom,prefix,'from')}</div><div class="date-dd-today" onclick="dpToday('${prefix}','from')">Today</div></div>`+
    `<div class="date-dd-col"><div class="date-dd-label">To:</div><input class="date-dd-input" value="${fmtDMY(st.draftTo)}" placeholder="DD/MM/YYYY" readonly><div class="cal-head"><button onclick="dpNav('${prefix}','to',-1)"><i class="ti ti-chevron-left"></i></button><div class="cal-title">${monthName(st.toY,st.toM)}, ${st.toY}</div><button onclick="dpNav('${prefix}','to',1)"><i class="ti ti-chevron-right"></i></button></div><div class="cal-grid">${dowHtml}${calGrid(st.toY,st.toM,st.draftTo,prefix,'to')}</div><div class="date-dd-today" onclick="dpToday('${prefix}','to')">Today</div></div>`+
    `</div><div class="date-dd-foot" style="justify-content:flex-end"><button class="btn btn-primary btn-sm" onclick="dpApply('${prefix}')">Apply</button></div>`;
}
function dpPick(prefix,which,iso){const st=dpState(prefix);if(which==='from')st.draftFrom=iso;else st.draftTo=iso;renderDatePicker(prefix);}
function dpNav(prefix,which,delta){const st=dpState(prefix);let m=(which==='from')?st.fromM:st.toM,y=(which==='from')?st.fromY:st.toY;m+=delta;if(m<0){m=11;y--;}if(m>11){m=0;y++;}if(which==='from'){st.fromM=m;st.fromY=y;}else{st.toM=m;st.toY=y;}renderDatePicker(prefix);}
function dpToday(prefix,which){const now=new Date(),iso=fmtISO(now.getFullYear(),now.getMonth(),now.getDate()),st=dpState(prefix);if(which==='from'){st.fromY=now.getFullYear();st.fromM=now.getMonth();st.draftFrom=iso;}else{st.toY=now.getFullYear();st.toM=now.getMonth();st.draftTo=iso;}renderDatePicker(prefix);}
function dpApply(prefix){const st=dpState(prefix),fromEl=document.getElementById(prefix+'From'),toEl=document.getElementById(prefix+'To');if(fromEl)fromEl.value=st.draftFrom||'';if(toEl)toEl.value=st.draftTo||'';const lbl=document.getElementById(prefix+'DateLabel');const hasVal=!!(st.draftFrom||st.draftTo);if(lbl)lbl.textContent=hasVal?`${fmtDMY(st.draftFrom)||'…'} – ${fmtDMY(st.draftTo)||'…'}`:'Select Date';const btn=document.getElementById(prefix+'DateBtn');if(btn)btn.classList.toggle('selected',hasVal);document.getElementById(prefix+'DateDd').classList.remove('open');if(prefix==='main')onSearch();else onListSearch();}
document.addEventListener('click',e=>{if(!e.target.closest('.date-dd-wrap'))document.querySelectorAll('.date-dd').forEach(d=>d.classList.remove('open'));});

function analyticsSource(){

function analyticsData(){
  const now=new Date(),minDate=new Date(now.getFullYear(),now.getMonth()-anRange+1,1);
  let rows=analyticsSource().filter(a=>new Date(a.auctionStart)>=minDate);
  const months=[];for(let i=anRange-1;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,label:d.toLocaleDateString('th-TH',{month:'short',year:'2-digit'})});}
  const savBy={},volBy={},apprBy={},rejBy={},daysSumBy={},daysCntBy={};months.forEach(m=>{savBy[m.key]=0;volBy[m.key]=0;apprBy[m.key]=0;rejBy[m.key]=0;daysSumBy[m.key]=0;daysCntBy[m.key]=0;});
  let totalSav=0,totalSpend=0,totalBudgetAw=0,oc_c=0,oc_nr=0,oc_in=0,oc_na=0,bidSum=0,bidCnt=0,rejected=0;
  /* [MOCK] แหล่งที่มาของผู้ชนะ + รายเดิม/รายใหม่ อนุมานแบบคงที่จาก auctionId (เดโมไม่มีฟิลด์จริง) */
  const winSrc={req:{existing:0,new:0},ptvn:{existing:0,new:0}};
  rows.forEach(a=>{const d=new Date(a.auctionStart),key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;if(volBy[key]!==undefined)volBy[key]++;
    /* อนุมัติ vs ตีกลับ รายเดือน (นับตามผลของงานที่ผ่านมือผู้อนุมัติ) */
    const isRej=a.award==='rejected'||a.approvalFlow?.result?.state==='rejected'||a.approvalFlow?.setup?.state==='rejected';
    if(key in apprBy){if(isRej)rejBy[key]++;else apprBy[key]++;
      /* เวลาเฉลี่ยที่ใช้อนุมัติ (วัน) — อนุมานคงที่ 1–7 วันจาก auctionId */
      const days=(hashInt(a.auctionId)%7)+1;daysSumBy[key]+=days;daysCntBy[key]++;}
    if(a.status==='Complete'||a.award==='awarded'||a.award==='awaiting-approval'){oc_c++;if(a.budget&&a.winning){const s=a.budget-a.winning;totalSav+=s;totalSpend+=a.winning;totalBudgetAw+=a.budget;if(savBy[key]!==undefined)savBy[key]+=s;}
      /* ผู้ชนะมาจากไหน — เฉพาะงานที่ได้ผู้ชนะแล้ว */

    }else if(a.award==='no-result')oc_nr++;else if(a.award==='insufficient')oc_in++;else if(a.award==='no-award')oc_na++;if(a.award==='rejected')rejected++;if(a.bidders>0){bidSum+=a.bidders;bidCnt++;}});
  const avgDaysBy={};months.forEach(m=>{avgDaysBy[m.key]=daysCntBy[m.key]?+(daysSumBy[m.key]/daysCntBy[m.key]).toFixed(1):0;});

  return{months,savBy,volBy,apprBy,rejBy,avgDaysBy,winSrc,repeatWinners:repeatWinnersMock(oc_c),totalSav,totalSpend,succRate,succDenom,avgBid,savPct,rejected,approvedCount:oc_c,outcome:{complete:oc_c,noresult:oc_nr,insufficient:oc_in,noaward:oc_na}};
}

    head.innerHTML=`<tr><th style="min-width:120px">รหัสการประมูล</th><th style="min-width:200px">ชื่อการประมูล</th><th style="min-width:170px">ประเภทการอนุมัติ</th><th style="min-width:170px">ผู้ขออนุมัติ</th><th style="min-width:110px">วันที่ขอ</th></tr>`;
  }else{
    bar.innerHTML=`<input class="in in-text" id="lvQ" type="text" placeholder="ค้นหา..." oninput="onListSearch()"><select class="in in-field" id="lvField" onchange="onListSearch()"><option value="all">All Fields</option><option value="auctionId">AuctionID</option><option value="format">Format</option><option value="type">Type</option><option value="name">Auction Name</option><option value="award">Award Status</option><option value="creator">Create by</option></select><input type="hidden" id="lvFrom"><input type="hidden" id="lvTo"><div class="date-dd-wrap"><button class="btn-datepick" id="lvDateBtn" onclick="toggleDatePicker('lv')"><span id="lvDateLabel">Select Date</span><i class="ti ti-chevron-down" style="font-size:13px"></i></button><div class="date-dd" id="lvDateDd" onclick="event.stopPropagation()"></div></div><button class="btn btn-ghost" style="height:34px;padding:0 10px" onclick="clearListSearch()"><i class="ti ti-refresh"></i></button>`;
    head.innerHTML=`<tr><th style="min-width:128px">AuctionID</th><th style="min-width:120px">Format</th><th style="min-width:80px">Type</th><th style="min-width:190px">Auction Name</th><th style="min-width:190px">Status</th><th style="min-width:140px">Auction Date</th><th style="min-width:160px">Award Status</th><th style="min-width:110px">Create by</th></tr>`;
  }
}
function loadList(){const ld=document.getElementById('loadList');ld.classList.add('show');setTimeout(()=>{
  if(listScope==='history'){
    let rows=approvalHistory.slice();const q=(val('lvQ')||'').toLowerCase(),ty=val('lvType'),rs=val('lvResult');
    rows=rows.filter(h=>(!q||h.auctionId.toLowerCase().includes(q)||h.name.toLowerCase().includes(q))&&(ty==='all'||h.type===ty)&&(rs==='all'||h.result===rs));
    const total=rows.length,totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));listPage=Math.min(listPage,totalPages);const pageRows=rows.slice((listPage-1)*PAGE_SIZE,(listPage-1)*PAGE_SIZE+PAGE_SIZE);
    document.getElementById('lvTb').innerHTML=pageRows.length?pageRows.map(h=>{const tag=h.type==='setup'?`<span class="ap-type ap-setup"><i class="ti ti-clipboard-check"></i> อนุมัติจัดงาน</span>`:`<span class="ap-type ap-result"><i class="ti ti-trophy"></i> อนุมัติผล</span>`;const res=h.result==='approved'?`<span class="ap-res-ok"><i class="ti ti-check"></i> อนุมัติ</span>`:`<span class="ap-res-rej"><i class="ti ti-arrow-back-up"></i> ตีกลับ</span>`;const bw=h.winning?`${h.budget}→${h.winning} ลบ.`:`${h.budget} ลบ.`;return`<tr onclick="openDetail('${h.auctionId}')"><td class="td-mono">${h.auctionId}</td><td class="td-clamp" title="${h.name}">${h.name}</td><td>${tag}</td><td>${res}</td><td style="font-size:11px">${bw}</td><td style="font-size:11px;color:var(--muted)">${h.at}</td></tr>`;}).join(''):`<tr class="empty-row"><td colspan="6">ไม่พบประวัติ</td></tr>`;
    document.getElementById('lvBadge').textContent=`${total} รายการ`;
    renderPagination(document.getElementById('lvPgBtns'),document.getElementById('lvPgInfo'),{total,totalPages,page:listPage},p=>{listPage=p;loadList();});
  }else if(listScope==='approvals'){
    let rows=getApprovalTasks();const q=(val('lvQ')||'').toLowerCase();
    if(q)rows=rows.filter(t=>t.auction.auctionId.toLowerCase().includes(q)||t.auction.name.toLowerCase().includes(q)||t.auction.creator.toLowerCase().includes(q));
    const total=rows.length,totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));listPage=Math.min(listPage,totalPages);
    const pageRows=rows.slice((listPage-1)*PAGE_SIZE,(listPage-1)*PAGE_SIZE+PAGE_SIZE);
    document.getElementById('lvTb').innerHTML=pageRows.length?pageRows.map(apprRowTpl).join(''):`<tr class="empty-row"><td colspan="5"><i class="ti ti-circle-check" style="font-size:24px;color:var(--ok);display:block;margin-bottom:6px"></i>ไม่มีงานรออนุมัติ — เคลียร์หมดแล้ว 🎉</td></tr>`;
    document.getElementById('lvBadge').textContent=`${total} รายการ`;
    renderPagination(document.getElementById('lvPgBtns'),document.getElementById('lvPgInfo'),{total,totalPages,page:listPage},p=>{listPage=p;loadList();});
  }else{
    const res=queryAuctions({listScope,groupFilter:'',q:val('lvQ'),field:val('lvField'),from:val('lvFrom'),to:val('lvTo'),page:listPage});listPage=res.page;
    document.getElementById('lvTb').innerHTML=res.rows.length?res.rows.map(a=>{const ph=auctionPhase(a);const rc=inAwardRejected(a)?'row-rej':(isActionItem(a)?'row-alert':(ph==='live'?'row-live':''));return`<tr class="${rc}" onclick="openDetail('${a.auctionId}')"><td class="td-mono">${a.auctionId}</td><td>${a.format}</td><td>${a.type}</td><td class="td-clamp" title="${a.name}">${a.name}</td><td>${statusPill(a)}</td><td>${dateCell(a)}</td><td>${awardChip(a)}</td><td>${a.creator}</td></tr>`;}).join(''):`<tr class="empty-row"><td colspan="8">ไม่พบรายการ</td></tr>`;
    document.getElementById('lvBadge').textContent=`${res.total} รายการ`;
    renderPagination(document.getElementById('lvPgBtns'),document.getElementById('lvPgInfo'),res,p=>{listPage=p;loadList();});
  }
  ld.classList.remove('show');},120);}
function onListSearch(){clearTimeout(listTimer);listTimer=setTimeout(()=>{listPage=1;loadList();},300);}
function clearListSearch(){['lvQ','lvFrom','lvTo'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});['lvField','lvType','lvResult'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='all';});delete datePickers.lv;const lbl=document.getElementById('lvDateLabel');if(lbl)lbl.textContent='Select Date';const btn=document.getElementById('lvDateBtn');if(btn)btn.classList.remove('selected');listPage=1;loadList();}

function qaStats(no){const l=qaData[no]||[];const n=l.filter(x=>!x.a).length;return{total:l.length,pending:n,answered:l.length-n};}
function renderQA(){
  if(!hasRole('purchaser'))return;
  const keys=Object.keys(qaData).sort((a,b)=>qaStats(b).pending-qaStats(a).pending);
  const totalNew=keys.reduce((s,no)=>{const a=auctions.find(x=>x.auctionId===no);return s+((a&&qaBoardOpen(a))?qaStats(no).pending:0);},0);
  const qaCnt=document.getElementById('tbQaCount');if(qaCnt){qaCnt.textContent=totalNew;qaCnt.className=`cnt ${totalNew===0?'cnt-green':'cnt-red'}`;}
  const listEl=document.getElementById('ddQaList');if(!listEl)return;
  listEl.innerHTML=keys.length?keys.map(no=>{const a=auctions.find(x=>x.auctionId===no);const open=a&&qaBoardOpen(a);const s=qaStats(no),nm=auctionName(no),latest=(qaData[no]&&qaData[no][0])?qaData[no][0].t:'';const pendingShown=open?s.pending:0;return`<div class="tb-dd-item" onclick="openQA('${no}');document.getElementById('ddQa').classList.remove('open')"><div class="tb-dd-dot" style="background:${pendingShown>0?'#D06A6A':'#7C7C7C'}"></div><div style="flex:1;min-width:0"><div class="tb-dd-name">${nm}</div><div class="tb-dd-id">${no}</div><div class="tb-dd-sub">${latest}</div></div>${pendingShown>0?`<span class="badge-small b-new">${pendingShown} ใหม่</span>`:''}</div>`;}).join(''):`<div style="padding:16px;text-align:center;font-size:12px;color:var(--muted)">ไม่มี Q&A</div>`;
}
function openQA(no){const list=qaData[no]||[],nm=auctionName(no);document.getElementById('qaModalTitle').textContent=nm;document.getElementById('qaModalBody').innerHTML=`<div class="qa-modal-sub"><i class="ti ti-hash" style="font-size:12px"></i> ${no} · คำถามทั้งหมด (${list.length} รายการ)</div>${list.map((item,i)=>`<div class="mini-q"><div class="mini-q-top"><span class="mini-q-user">${item.id}</span><span class="mini-q-time">${item.t}</span></div><div class="mini-q-text">${item.q}</div>${item.a?`<div class="mini-q-ans"><i class="ti ti-circle-check-filled"></i>${item.a}</div>`:`<div id="ans-${no}-${i}" class="mini-q-editor" contenteditable="true" data-placeholder="พิมพ์ข้อความคำตอบที่นี่..."></div><button id="sb-${no}-${i}" class="btn qa-send-btn btn-sm" style="margin-top:8px" onclick="submitQA('${no}',${i})"><i class="ti ti-send"></i> ส่งคำตอบ</button>`}</div>`).join('')}<div class="modal-actions"><button class="btn" onclick="closeModal('qaModal')">ปิด</button></div>`;openModal('qaModal');}
async function submitQA(no,idx){const box=document.getElementById(`ans-${no}-${idx}`),btn=document.getElementById(`sb-${no}-${idx}`);if(!box||!btn)return;const v=(box.textContent||'').trim();if(!v){showToast('กรุณาพิมพ์คำตอบก่อนส่ง');return;}btn.disabled=true;btn.innerHTML=`<i class="ti ti-loader-2" style="animation:spin 1s linear infinite"></i> กำลังส่ง...`;await new Promise(r=>setTimeout(r,500));qaData[no][idx].a=v;showToast('ส่งคำตอบเรียบร้อย');openQA(no);renderQA();}

function openDetail(id){
  const a=auctions.find(x=>x.auctionId===id);if(!a)return;
  const {dateStr,timeStr}=dtParts(a),ph=auctionPhase(a),ds=displayStatus(a);
  document.getElementById('detailTitle').textContent=`${a.auctionId} · ${a.name}`;
  let alertBox='';
  const isApprover=hasRole('approver');const f=a.approvalFlow;
  if(isApprover&&f&&(f.setup?.state==='pending'&&f.setup.approver===AP_ME())){
    alertBox=`<div style="grid-column:1/-1;background:var(--purple-bg);border:1px solid var(--purple-bd);border-radius:12px;padding:13px"><div style="font-size:10px;font-weight:700;color:var(--purple-deep);display:flex;align-items:center;gap:5px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em"><i class="ti ti-clipboard-check"></i> รอคุณอนุมัติ: ให้จัดงาน · ผู้ขอ ${a.creator}</div><div style="font-size:12px;color:#6a4fa0">งานนี้รอการอนุมัติจากคุณเพื่อเปิดประมูล — กรุณาตรวจสอบในอีเมล/หน้างานแล้วอนุมัติ</div><button class="btn btn-purple btn-sm" style="margin-top:10px" onclick="showToast('เปิดหน้าอนุมัติ (ไปที่อีเมล/หน้างาน)...');closeModal('detailModal')"><i class="ti ti-external-link"></i> ไปหน้าอนุมัติ</button></div>`;
  }else if(isApprover&&f&&(f.result?.state==='pending'&&f.result.approver===AP_ME())){
    const sv=a.budget&&a.winning?(a.budget-a.winning).toFixed(1):null;
    alertBox=`<div style="grid-column:1/-1;background:var(--purple-bg);border:1px solid var(--purple-bd);border-radius:12px;padding:13px"><div style="font-size:10px;font-weight:700;color:var(--purple-deep);display:flex;align-items:center;gap:5px;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em"><i class="ti ti-trophy"></i> รอคุณอนุมัติ: ผลประมูล · ผู้ขอ ${a.creator}</div><div style="font-size:12px;color:#6a4fa0">ผู้ชนะเสนอ ${a.winning} ลบ.${sv?` (ประหยัด ${sv} ลบ.)`:''} — รอคุณอนุมัติผล</div><button class="btn btn-purple btn-sm" style="margin-top:10px" onclick="showToast('เปิดหน้าอนุมัติผล (ไปที่อีเมล/หน้างาน)...');closeModal('detailModal')"><i class="ti ti-external-link"></i> ไปหน้าอนุมัติผล</button></div>`;
  }else if(inAwardRejected(a)){alertBox=`<div style="grid-column:1/-1;background:var(--orange-bg);border:1px solid var(--orange-bd);border-radius:12px;padding:13px"><div style="font-size:10px;font-weight:700;color:var(--orange);display:flex;align-items:center;gap:4px;margin-bottom:6px;text-transform:uppercase"><i class="ti ti-gavel"></i> ผลการ Award ถูกตีกลับ</div><div style="font-size:12px;color:#8a5a30">${a.rejectNote?`<b>เหตุผล:</b> ${a.rejectNote}`:'ผู้อนุมัติไม่อนุมัติผล'}</div></div>`;}
  else if(ph==='live'){alertBox=`<div style="grid-column:1/-1;background:var(--ok-bg);border:1px solid var(--ok-bd);border-radius:12px;padding:13px"><div style="font-size:10px;font-weight:700;color:var(--ok);display:flex;align-items:center;gap:5px;margin-bottom:6px;text-transform:uppercase"><span class="live-dot"></span> Live</div><div style="font-size:12px;color:#17794C">ประมูลเปิดอยู่ตอนนี้ (${timeStr})</div></div>`;}
  else if(ph==='scheduled'){alertBox=`<div style="grid-column:1/-1;background:var(--blue-bg);border:1px solid var(--blue-bd);border-radius:12px;padding:13px"><div style="font-size:10px;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:5px;margin-bottom:6px;text-transform:uppercase"><i class="ti ti-calendar-clock"></i> รอเปิดประมูล</div><div style="font-size:12px;color:#3a5db8">กำหนด ${dateStr} ${timeStr}</div></div>`;}
  else if(a.infoRequest){alertBox=`<div style="grid-column:1/-1;background:var(--danger-bg);border:1px solid var(--danger-bd);border-radius:12px;padding:13px"><div style="font-size:10px;font-weight:700;color:var(--danger);display:flex;align-items:center;gap:4px;margin-bottom:6px;text-transform:uppercase"><i class="ti ti-alert-circle"></i> Commercial Info Request</div><div style="font-size:12px;color:#8a4444">${a.infoRequest}</div></div>`;}
  else if(a.status==='Cancelled'){alertBox=`<div style="grid-column:1/-1;background:#F4F5F8;border:1px solid #E6E8EB;border-radius:12px;padding:13px"><div style="font-size:10px;font-weight:700;color:#7C7C7C;display:flex;align-items:center;gap:4px;margin-bottom:6px;text-transform:uppercase"><i class="ti ti-ban"></i> งานถูกยกเลิก</div><div style="font-size:12px;color:#7C7C7C"><b>เหตุผล:</b> ${cancelReasonText(a)}${a.cancelNote?`<br><b>หมายเหตุ:</b> ${a.cancelNote}`:''}</div></div>`;}
  const savings=a.budget&&a.winning?(a.budget-a.winning).toFixed(1):null;
  document.getElementById('detailGrid').innerHTML=`${alertBox}<div class="d-box"><div class="d-key">Format</div><div class="d-val">${a.format}</div></div><div class="d-box"><div class="d-key">Type</div><div class="d-val">${a.type}</div></div><div class="d-box"><div class="d-key">Status</div><div class="d-val"><span class="pill ${statusClass[ds]||'st-draft'}">${ds}</span></div></div><div class="d-box"><div class="d-key">Award Status</div><div class="d-val">${awardChip(a)}</div></div><div class="d-box"><div class="d-key">Auction Date</div><div class="d-val">${dateStr} · ${timeStr}</div></div><div class="d-box"><div class="d-key">งบประมาณ</div><div class="d-val">${a.budget?a.budget+' ลบ.':'—'}</div></div><div class="d-box"><div class="d-key">ราคาปิด / Savings</div><div class="d-val">${a.winning?a.winning+' ลบ. (ประหยัด '+savings+' ลบ.)':'—'}</div></div><div class="d-box"><div class="d-key">ผู้เข้าร่วม</div><div class="d-val">${a.bidders||0} ราย</div></div>`;
  const apInfo=f?`<div class="t-row"><span class="t-left">อนุมัติจัดงาน</span><span class="t-right">${f.setup?.state||'-'}</span></div><div class="t-row"><span class="t-left">อนุมัติผล</span><span class="t-right">${f.result?.state||'-'}</span></div>`:'';
  document.getElementById('detailTimeline').innerHTML=`<div class="t-row"><span class="t-left">สร้างงาน</span><span class="t-right">${a.creator}</span></div><div class="t-row"><span class="t-left">กำหนดประมูล</span><span class="t-right">${dateStr} ${timeStr}</span></div>${apInfo}<div class="t-row"><span class="t-left">Status</span><span class="t-right">${ds}</span></div>`;
  openModal('detailModal');
}

function openModal(id){document.getElementById(id).classList.add('open')}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function closeIfOverlay(e,id){if(e.target===document.getElementById(id))closeModal(id)}
function showToast(msg){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal('detailModal');closeModal('qaModal');}});
function toggleDd(id){document.getElementById(id).classList.toggle('open');}
document.addEventListener('click',e=>{if(!e.target.closest('.dd-wrap'))document.querySelectorAll('.tb-dropdown').forEach(d=>d.classList.remove('open'));});

function renderActionBar(){
  const badges=document.getElementById('roleBadges');
  const roleLabels=CU().roles.map(r=>r==='purchaser'?'Purchaser':'Approver');
  badges.innerHTML=`Your role: ${roleLabels.join(', ')}`;
  const right=document.getElementById('actionRight');let html='';
  if(hasRole('purchaser')){
    html+=`<button class="btn btn-create" onclick="showToast('เปิดฟอร์มสร้างงานใหม่...')"><i class="ti ti-plus"></i> สร้างงานใหม่</button>`;
  }else{
    html+=`<span style="font-size:11px;color:var(--muted)"><i class="ti ti-gavel"></i> โหมดผู้อนุมัติ</span>`;
  }
  right.innerHTML=html;
}

function setScope(s){anScope=s;document.querySelectorAll('#scopeSeg button').forEach(b=>b.classList.toggle('active',b.dataset.scope===s));renderDashboard();}
function switchUser(key){currentUserKey=key;anScope='mine';groupFilter='';mainPage=1;analyticsView='created';document.getElementById('tbAvatar').textContent=CU().initials;document.querySelectorAll('#scopeSeg button').forEach(b=>b.classList.toggle('active',b.dataset.scope==='mine'));renderAll();}

/* [PATCH 3+4] renderDashboard */
function renderDashboard(){
  renderKpiGroup();
  const mainCol=document.getElementById('mainCol');
  const sideCol=document.getElementById('sideCol');
  const apprSlot=document.getElementById('approvalWidgetSlot');
  const layoutRow=document.getElementById('layoutRow');
  const isPurchaser=hasRole('purchaser'),isApprover=hasRole('approver'),both=isPurchaser&&isApprover;
  const isApproverOnly=isApprover&&!isPurchaser;
  apprSlot.innerHTML='';

  /* [PATCH] งานที่ต้องอนุมัติ อยู่แถวบนสุดของ main-col (แถวเดียวกับงานที่กำลังจะมาถึงใน side-col) */
  let mainHtml='';
  if(isApprover)mainHtml+=renderApprovalWidget();
  if(!isApproverOnly)mainHtml+=renderMainTable();
  mainCol.innerHTML=mainHtml;

  // side column
  let sideHtml='';
  if(isPurchaser)sideHtml+=renderUpcomingWidget();
  if(!isApproverOnly)sideHtml+=renderQuickActionWidget();
  sideCol.innerHTML=sideHtml;

  // approver-only: no side column (full width main)
  if(isApproverOnly){layoutRow.classList.add('no-side');}else{layoutRow.classList.remove('no-side');}

  renderAnalyticsShell();
  if(isPurchaser){loadMain();}
  renderQA();
}
function renderAll(){renderActionBar();renderDashboard();renderNotif();}
renderAll();
</script>
